version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: nexus-db
    restart: always
    environment:
      MYSQL_DATABASE: nexusdb
      MYSQL_USER: nexususer
      MYSQL_PASSWORD: nexuspass
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - nexus-db-data:/var/lib/mysql

  backend:
    build: ./nexus-backend
    container_name: nexus-backend
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/nexusdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: nexususer
      SPRING_DATASOURCE_PASSWORD: nexuspass
      SPRING_PROFILES_ACTIVE: docker

  frontend:
    build: ./nexus-frontend
    container_name: nexus-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  nexus-db-data:
